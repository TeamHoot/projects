# GitHub Pages 배포 — TeamHoot/TeamHoot.github.io (https://teamhoot.github.io)
# main 푸시 시 Vite 빌드(vite-react-ssg 프리렌더) 후 Pages로 배포한다.
#
# 전제(1회 수동):
#   1. TeamHoot/TeamHoot.github.io 레포가 존재할 것 (Public).
#      루트 주소로 서비스하려면 레포 이름이 반드시 <계정명>.github.io 여야 한다.
#   2. 레포 Settings > Pages > Source = "GitHub Actions".
#   3. vite.config.ts 의 base 가 "/" 일 것 (프로젝트 페이지라면 "/<repo>/").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
