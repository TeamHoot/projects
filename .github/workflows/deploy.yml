# GitHub Pages 배포 — TeamHoot/projects (https://teamhoot.github.io/projects)
# main 푸시 시 Vite 빌드(vite-react-ssg 프리렌더) 후 Pages로 배포한다.
#
# 전제(1회 수동): 레포 Settings > Pages > Source = "GitHub Actions".
#
# 경로: 레포 이름이 `projects` 이므로 URL 이 /projects 하위가 된다.
# base·basename·E2E baseURL 은 site.config.ts 의 BASE_PATH 하나에서 나온다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
